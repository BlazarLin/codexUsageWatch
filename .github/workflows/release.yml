# 创建时间: 2026-09-11
# 功能: 发布流水线 - 推送 v* 标签时自动构建并发布
# 目的: Windows Runner 上完成 PyInstaller 打包与 NSIS 安装包制作,
#       将安装包上传到 GitHub Release 供用户下载安装。

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyQt5 pyinstaller

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate version info
        shell: pwsh
        run: |
          $v = $env:APP_VERSION
          $vv = ($v -replace '[^0-9.]','').Split('.') | ForEach-Object { [int]$_ }
          while ($vv.Count -lt 4) { $vv += 0 }
          $vv = $vv -join ','
          @(
            '# UTF-8'
            'VSVersionInfo('
            '  ffi=FixedFileInfo('
            "    filevers=($vv), prodvers=($vv),"
            '    mask=0x3F, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0),'
            '  ),'
            '  kids=['
            '    StringFileInfo(['
            "      StringTable('040904B0', ["
            "        StringStruct('CompanyName', 'codexUsageWatch'),"
            "        StringStruct('FileDescription', 'Codex 用量悬浮窗 - 剩余用量与重置倒计时监视'),"
            "        StringStruct('FileVersion', '$v.0'),"
            "        StringStruct('InternalName', 'CodexUsageWatch'),"
            "        StringStruct('LegalCopyright', 'MIT License'),"
            "        StringStruct('OriginalFilename', 'CodexUsageWatch.exe'),"
            "        StringStruct('ProductName', 'Codex Usage Watch'),"
            "        StringStruct('ProductVersion', '$v.0'),"
            '      ]),'
            '    ]),'
            "    VarFileInfo([VarStruct('Translation', [1033, 1200])]),"
            '  ],'
            ')'
          ) | Out-File -FilePath version_info.txt -Encoding utf8

      - name: Build exe (PyInstaller)
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name CodexUsageWatch
          --icon assets/icon.ico
          --version-file version_info.txt
          --add-data "assets;assets"
          main.py

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          # 定位 makensis: PATH -> 常见安装位置 -> choco lib 递归搜索
          function Find-Makensis {
            $c = Get-Command makensis -ErrorAction SilentlyContinue
            if ($c) { return $c.Source }
            foreach ($p in @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe",
              "C:\ProgramData\chocolatey\bin\makensis.exe"
            )) { if (Test-Path $p) { return $p } }
            return $null
          }
          $mk = Find-Makensis
          if (-not $mk) {
            choco install nsis -y --no-progress
            $mk = Find-Makensis
          }
          if (-not $mk) {
            # 兜底: choco zip 便携包解压在 lib 下, 递归搜索
            $mk = Get-ChildItem "C:\ProgramData\chocolatey\lib" `
              -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $mk -or -not (Test-Path $mk)) {
            Write-Error "makensis 未找到"
            exit 1
          }
          Write-Host "makensis: $mk"
          New-Item -ItemType Directory -Force -Path installer | Out-Null  # NSIS 不自动创建 OutFile 目录
          & $mk /DAPP_VERSION=$env:APP_VERSION installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "installer/CodexUsageWatch-Setup-*.exe")) {
            Write-Error "安装包未生成, 阻止空发布"
            exit 1
          }
          Compress-Archive -Path "dist/CodexUsageWatch.exe" `
            -DestinationPath "installer/CodexUsageWatch-portable-win64.zip" -Force
          Get-ChildItem installer

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/CodexUsageWatch-Setup-*.exe
            installer/CodexUsageWatch-portable-win64.zip
          generate_release_notes: true
